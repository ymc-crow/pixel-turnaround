[project]
name = "spritehatch"
version = "0.1.0"
description = "One pixel-art character, every direction, same look. Uses ComfyUI + SDXL + OpenPose."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pillow>=10", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
spritehatch = "spritehatch.cli:main"
spritehatch-animate = "spritehatch.animate:main"

[tool.setuptools]
packages = ["spritehatch"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
